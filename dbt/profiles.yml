fincore:
  target: local

  outputs:
    local:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'warehouse-db') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'fincore_warehouse') }}"
      schema: public
      threads: 4
      connect_timeout: 15
